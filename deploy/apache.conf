# Replace parts.example.com and certificate paths before enabling.
<VirtualHost *:80>
    ServerName parts.example.com
    Redirect permanent / https://parts.example.com/
</VirtualHost>
<VirtualHost *:443>
    ServerName parts.example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/parts.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/parts.example.com/privkey.pem
    DocumentRoot /opt/partsdb/frontend/dist
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    <Directory /opt/partsdb/frontend/dist>
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
